name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install fastapi "uvicorn[standard]" pydantic pytest httpx
      - name: Run the suite
        working-directory: backend
        run: python -m pytest tests -q
